name: Scheduler publish cron

# Drives /api/scheduler/cron every 5 minutes from GitHub Actions because
# Vercel Hobby caps cron jobs at once-per-day. Reuses the same VIRALX_CRON_SECRET
# repo secret (server-side both endpoints check process.env.CRON_SECRET).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST to /api/scheduler/cron
        env:
          CRON_SECRET: ${{ secrets.VIRALX_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "VIRALX_CRON_SECRET secret is not set in GitHub repo settings"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.growthhunt.ai/api/scheduler/cron")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
